apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project-frontend
  namespace: devops-project
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: devops-project-frontend
  template:
    metadata:
      labels:
        app: devops-project-frontend
    spec:
      containers:
        - name: frontend
          image: devops-project-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: APP_ROLE
              value: frontend
          envFrom:
            - configMapRef:
                name: devops-project-config
            - secretRef:
                name: devops-project-secret
          volumeMounts:
            - name: uploads
              mountPath: /app/devops-project/uploads/demandes
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /devops-project/php-login/index.php
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /devops-project/php-login/index.php
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: devops-project-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: devops-project-frontend
  namespace: devops-project
spec:
  selector:
    app: devops-project-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-project-frontend-hpa
  namespace: devops-project
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-project-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devops-project-frontend-pdb
  namespace: devops-project
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: devops-project-frontend
