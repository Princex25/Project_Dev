apiVersion: v1
kind: Secret
metadata:
  name: devops-project-secret
  namespace: devops-project
type: Opaque
# ⚠️ En production, utiliser External Secrets Operator avec AWS Secrets Manager
# Voir : https://external-secrets.io/
stringData:
  DB_USER: "app"
  DB_PASS: "${DB_PASSWORD}"
  DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"