apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project
  namespace: devops-project
  labels:
    app: devops-project
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: devops-project
  template:
    metadata:
      labels:
        app: devops-project
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - devops-project
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: devops-project-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: devops-project-config
            - secretRef:
                name: devops-project-secret
          volumeMounts:
            - name: uploads
              mountPath: /app/devops-project/uploads
            - name: shared-config
              mountPath: /app/devops-project/shared
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /devops-project/php-login/index.php
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /devops-project/php-login/index.php
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: devops-project-efs
        - name: shared-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devops-project
  namespace: devops-project
  labels:
    app: devops-project
spec:
  type: ClusterIP
  selector:
    app: devops-project
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP