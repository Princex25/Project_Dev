# ============================================================
# Docker Compose — Développement local uniquement
# Pour la production, utiliser Kubernetes/EKS + Terraform
# ============================================================

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      WEB_DOCUMENT_ROOT: /app
      WEB_DOCUMENT_INDEX: index.php
      DB_HOST: db
      DB_NAME: gestion_demandes
      DB_USER: app
      DB_PASS: app
      DB_PORT: 3306
      APP_BASE_URL: "http://localhost:8080"
    depends_on:
      - db
    volumes:
      - ./App/uploads:/app/devops-project/uploads
    restart: unless-stopped

  db:
    build:
      context: ..
      dockerfile: App/admin/database/Dockerfile
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: gestion_demandes
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data: