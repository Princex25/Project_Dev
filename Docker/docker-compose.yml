# ============================================================
# Docker Compose — Développement local uniquement
# Pour la production, utiliser Kubernetes/EKS + Terraform
# ============================================================

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: gestion_demandes
      DB_USER: app
      DB_PASS: app
      DB_PORT: 3306
      BASE_URL: /devops-project
    depends_on:
      - db
    volumes:
      - ./App/uploads/demandes:/app/devops-project/uploads/demandes
      - ./App/shared/config.php:/app/devops-project/shared/config.php
    restart: unless-stopped

  db:
    build:
      context: ..
      dockerfile: App/admin/database/Dockerfile
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: gestion_demandes
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data: