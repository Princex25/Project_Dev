---
# ============================================================
# Rôle : monitoring — Installation de Prometheus et Grafana
# ============================================================

# -- Namespace monitoring --
- name: "Monitoring | Création du namespace"
  shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    k3s kubectl create namespace monitoring --dry-run=client -o yaml | k3s kubectl apply -f -
  register: monitoring_ns
  changed_when: "'created' in monitoring_ns.stderr or 'unchanged' in monitoring_ns.stderr"

# -- Prometheus via Helm --
- name: "Monitoring | Ajout dépôt Helm Prometheus"
  shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: "Monitoring | Installation Prometheus"
  shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
      --namespace monitoring \
      --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
      --set prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues=false \
      --set prometheus.prometheusSpec.ruleSelectorNilUsesHelmValues=false \
      --set grafana.service.type=NodePort \
      --set prometheus.prometheusSpec.service.type=NodePort \
      --set alertmanager.alertmanagerSpec.service.type=NodePort \
      --wait --timeout 120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# -- Node Exporter DaemonSet --
- name: "Monitoring | Installation node-exporter (DaemonSet K3s natif)"
  shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    k3s kubectl apply -f - <<EOF
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.7.0
          ports:
            - containerPort: 9100
              hostPort: 9100
              name: metrics
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# -- ServiceMonitor pour node-exporter --
- name: "Monitoring | ServiceMonitor node-exporter"
  shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    k3s kubectl apply -f - <<EOF
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter
  endpoints:
    - port: metrics
      interval: 15s
EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml