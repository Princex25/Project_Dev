# ============================================================
# Variables globales — Ansible
# ============================================================

---
# General
project_name: devops-project
environment: dev
domain_name: ""

# K3s
k3s_version: v1.30.4+k3s1
k3s_token: "CHANGE_ME_SECRET_TOKEN"
k3s_cluster_name: devops-project-cluster
k3s_install_dir: /var/lib/rancher/k3s

# Database
db_host: "10.0.10.100"
db_port: 3306
db_name: gestion_demandes
db_user: app
db_password: "CHANGE_ME_DB_PASSWORD"

# Application
base_url: /devops-project
app_port: 80

# Docker
docker_version: "24.0"

# Monitoring
prometheus_version: "v2.54.1"
grafana_version: "11.2.0"

# Timezone (pour les containers)
timezone: "Europe/Paris"